name: SUP3RNOVA Gitmost image

on:
  workflow_dispatch:
  push:
    branches:
      - sup3rnova-v0.94.1-brand.1

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sup3rnova3/sup3rnova-gitmost
  TAG: v0.94.1-brand.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ env.TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
