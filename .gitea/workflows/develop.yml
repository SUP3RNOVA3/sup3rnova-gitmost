name: Publish image to the Gitea registry

# Deliberately NOT a copy of .github/workflows/develop.yml.
#
# The full gate — unit tests, both e2e suites and the image boot-smoke — runs on
# GitHub Actions for the same commit and is not duplicated here. Porting it would
# mean changing project code for a second copy of the same checks: the e2e jobs
# reach their service containers on localhost (GitHub publishes service ports on
# the runner host; Gitea puts services on the job network), and
# scripts/ci/image-smoke.sh runs the image with --network host expecting the same
# topology. On top of that several suites use short per-test timeouts that this
# runner does not reliably meet — two different tests timed out on two
# consecutive runs, so chasing them would be endless.
#
# What is left here is the one thing GitHub cannot do for us: publish the image
# to our own registry.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: gitea-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: gitea.vvzvlad.xyz/projects/gitmost

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the version is derived from git describe.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: gitea.vvzvlad.xyz
          username: ${{ github.repository_owner }}
          # Org-level secret on `projects`; GITEA_TOKEN has no package scope.
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Resolve version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:develop
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            AI_AGENT_ROLES_CATALOG_URL=https://raw.githubusercontent.com/vvzvlad/gitmost/develop/agent-roles-catalog
          cache-from: type=gha,scope=gitea-develop-amd64
          cache-to: type=gha,scope=gitea-develop-amd64,mode=max,ignore-error=true
