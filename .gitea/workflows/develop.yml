name: Mirror the gated image into the Gitea registry

# This is NOT a build, on purpose.
#
# ghcr.io/vvzvlad/gitmost:develop is published by .github/workflows/develop.yml
# only after the full gate passes: unit tests, both e2e suites and a boot-smoke
# of the exact image. Rebuilding here would produce a DIFFERENT, ungated image —
# and it would not sit in the registry harmlessly: four containers across four
# stacks run this tag (gitmost, docmost-asakusa, docmost-wb, docmost-ukuetis),
# all labelled for watchtower, which polls every two minutes. An ungated image
# would be live on four wikis within minutes.
#
# So we copy the exact artifact that passed the gate. skopeo copies by digest and
# skips layers already present, so a run with nothing new is cheap.
#
# Why polling and not `on: push`: at push time GitHub has not finished building
# that commit yet, so a push-triggered copy would fetch the previous image. The
# schedule picks the new one up once the gate is green.

on:
  workflow_dispatch:
  schedule:
    # Every 20 minutes. Off the hour to avoid the crowded :00 slot.
    - cron: '7,27,47 * * * *'

concurrency:
  group: gitea-mirror-image
  cancel-in-progress: false

permissions:
  contents: read

env:
  SRC: ghcr.io/vvzvlad/gitmost:develop
  DST: gitea.vvzvlad.xyz/projects/gitmost:develop

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Copy the gated image as-is
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          docker run --rm quay.io/skopeo/stable:latest copy \
            --src-creds "vvzvlad:${GHCR_PAT}" \
            --dest-creds "vvzvlad:${REGISTRY_TOKEN}" \
            "docker://${SRC}" "docker://${DST}"

      - name: Verify both sides point at the same digest
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          src=$(docker run --rm quay.io/skopeo/stable:latest inspect \
                  --creds "vvzvlad:${GHCR_PAT}" "docker://${SRC}" | grep -o '"Digest": "[^"]*"' | head -1)
          dst=$(docker run --rm quay.io/skopeo/stable:latest inspect \
                  --creds "vvzvlad:${REGISTRY_TOKEN}" "docker://${DST}" | grep -o '"Digest": "[^"]*"' | head -1)
          echo "source:      $src"
          echo "destination: $dst"
          # A mismatch means the copy silently produced a different artifact —
          # exactly what this workflow exists to prevent.
          [ "$src" = "$dst" ] || { echo "::error::digests differ"; exit 1; }
